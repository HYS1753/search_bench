[project]
name = "llm-as-a-judge"
version = "0.1.0"
description = "검색 API 비교 평가 플랫폼 — LLM as a Judge (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.5",
    "google-genai>=1.0.0",
    "google-auth>=2.35",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
